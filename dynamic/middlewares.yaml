http:
  middlewares:
    security-headers:
      headers:
        customResponseHeaders:
          X-Powered-By: ""
          Server: ""
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"

    rate-limit:
      rateLimit:
        average: 100
        burst: 50

    compression:
      compress: {}

    app-security:
      chain:
        middlewares:
          - security-headers
          - rate-limit
          - compression

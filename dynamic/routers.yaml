http:
  routers:
    app:
      rule: "Host(`agendamento.caieiras.sp.gov.br`)"
      entryPoints:
        - websecure
      service: app-service
      middlewares:
        - default-security-headers@file
      tls:
        certResolver: letsencrypt

  services:
    app-service:
      loadBalancer:
        servers:
          - url: "https://10.0.45.239:3000"


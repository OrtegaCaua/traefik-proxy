http:
  routers:
    app:
      rule: "Host(`nome do servidor`)"
      entryPoints:
        - websecure
      service: app-service
      middlewares:
        - default-security-headers@file
      tls:
        certResolver: letsencrypt

  services:
    app-service:
      loadBalancer:
        servers:
          - url: "https://ipservidor:3000"

